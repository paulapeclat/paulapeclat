<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ficha de jogadora de Paula Peclat: barras de habilidade, XP do mestrado e conquistas desbloqueadas">
  <defs>
    <radialGradient id="cGlow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#F23D91" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F23D91" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F23D91"/>
      <stop offset="100%" stop-color="#F2A2C0"/>
    </linearGradient>
    <clipPath id="xpClip">
      <rect x="24" y="96" width="472" height="14" rx="7"/>
    </clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Arial', sans-serif; }
    </style>
  </defs>

  <rect width="520" height="340" rx="16" fill="#000000"/>
  <rect width="520" height="340" rx="16" fill="url(#cGlow)"/>
  <rect x="0.5" y="0.5" width="519" height="339" rx="16" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- header -->
  <text x="24" y="34" font-size="11" font-weight="600" letter-spacing="2" fill="rgba(255,255,255,0.5)">FICHA DE JOGADORA</text>
  <text x="24" y="60" font-size="21" font-weight="800" fill="#FFFFFF">Paula Peclat</text>

  <rect x="380" y="30" width="116" height="30" rx="15" fill="rgba(34,195,217,0.12)" stroke="rgba(34,195,217,0.4)"/>
  <text x="438" y="49" font-size="12" font-weight="700" fill="#22C3D9" text-anchor="middle">★ multiclasse</text>

  <!-- XP principal -->
  <text x="24" y="88" font-size="12" fill="rgba(255,255,255,0.65)">XP · Mestrado — qualificação</text>
  <text x="496" y="88" font-size="12" font-weight="700" fill="#F23D91" text-anchor="end">78%</text>
  <rect x="24" y="96" width="472" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
  <rect x="24" y="96" width="368" height="14" rx="7" fill="url(#xpGrad)">
    <animate attributeName="width" from="0" to="368" dur="1.8s" fill="freeze"/>
  </rect>
  <g clip-path="url(#xpClip)">
    <rect x="-90" y="96" width="60" height="14" fill="#FFFFFF" opacity="0.22" transform="skewX(-20)">
      <animate attributeName="x" values="-90;560" dur="2.8s" begin="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- habilidades -->
  <g font-size="13" fill="rgba(255,255,255,0.65)">
    <text x="24" y="146">Ensino</text>
    <text x="24" y="176">Pesquisa</text>
    <text x="24" y="206">Game design</text>
    <text x="24" y="236">Python · Luau</text>
  </g>

  <rect x="150" y="136" width="280" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="136" width="266" height="10" rx="5" fill="#F23D91">
    <animate attributeName="width" from="0" to="266" dur="1.3s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="496" y="145" font-size="11" font-weight="700" fill="#F23D91" text-anchor="end">95</text>

  <rect x="150" y="166" width="280" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="166" width="238" height="10" rx="5" fill="#22C3D9">
    <animate attributeName="width" from="0" to="238" dur="1.3s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="496" y="175" font-size="11" font-weight="700" fill="#22C3D9" text-anchor="end">85</text>

  <rect x="150" y="196" width="280" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="196" width="210" height="10" rx="5" fill="#ECBE40">
    <animate attributeName="width" from="0" to="210" dur="1.3s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="496" y="205" font-size="11" font-weight="700" fill="#ECBE40" text-anchor="end">75</text>

  <rect x="150" y="226" width="280" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="226" width="182" height="10" rx="5" fill="#F2A2C0">
    <animate attributeName="width" from="0" to="182" dur="1.3s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="496" y="235" font-size="11" font-weight="700" fill="#F2A2C0" text-anchor="end">65</text>

  <!-- conquistas -->
  <text x="24" y="270" font-size="11" font-weight="600" letter-spacing="2" fill="rgba(255,255,255,0.5)">CONQUISTAS</text>

  <g>
    <circle cx="48" cy="296" r="16" fill="rgba(242,61,145,0.10)" stroke="rgba(242,61,145,0.5)" stroke-width="1.2"/>
    <text x="48" y="302" font-size="15" text-anchor="middle">🎓</text>
    <text x="48" y="328" font-size="9.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">mestrado</text>

    <circle cx="140" cy="296" r="16" fill="rgba(34,195,217,0.10)" stroke="rgba(34,195,217,0.5)" stroke-width="1.2"/>
    <text x="140" y="302" font-size="15" text-anchor="middle">🕹️</text>
    <text x="140" y="328" font-size="9.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">APedê Digital</text>

    <circle cx="232" cy="296" r="16" fill="rgba(236,190,64,0.10)" stroke="rgba(236,190,64,0.5)" stroke-width="1.2"/>
    <text x="232" y="302" font-size="15" text-anchor="middle">🌍</text>
    <text x="232" y="328" font-size="9.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">3 continentes</text>

    <circle cx="324" cy="296" r="16" fill="rgba(242,162,192,0.10)" stroke="rgba(242,162,192,0.5)" stroke-width="1.2"/>
    <text x="324" y="302" font-size="15" text-anchor="middle">📚</text>
    <text x="324" y="328" font-size="9.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">10+ estados</text>

    <circle cx="416" cy="296" r="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" values="0 416 296;360 416 296" dur="16s" repeatCount="indefinite"/>
    </circle>
    <text x="416" y="301" font-size="13" font-weight="700" fill="rgba(255,255,255,0.4)" text-anchor="middle">?</text>
    <text x="416" y="328" font-size="9.5" fill="rgba(255,255,255,0.35)" text-anchor="middle">em breve</text>
  </g>

  <!-- faísca -->
  <circle cx="486" cy="288" r="2.2" fill="#ECBE40">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="474" cy="304" r="1.5" fill="#F2A2C0">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>

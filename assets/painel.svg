<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Painel de competências da Profe Paula: 19 anos em sala de aula, alunos em 27 estados, gráfico radar de competências docentes e escada do currículo do concreto ao abstrato">
  <defs>
    <radialGradient id="pGlow1" cx="12%" cy="90%" r="60%"><stop offset="0" stop-color="#0284c7" stop-opacity=".22"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></radialGradient>
    <radialGradient id="pGlow2" cx="90%" cy="8%" r="55%"><stop offset="0" stop-color="#a855f7" stop-opacity=".18"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: 'Segoe UI', 'Arial', sans-serif }
      .h1 { font-size: 24px; font-weight: 800; fill: #f4f4f5; letter-spacing: 1px }
      .sub { font-size: 13px; fill: #a1a1aa }
      .kpi { font-size: 28px; font-weight: 800; fill: #f4f4f5 }
      .rot { font-size: 11.5px; fill: #a1a1aa }
      .h2 { font-size: 13px; font-weight: 700; fill: #f4f4f5; letter-spacing: .5px }
      .h2s { font-size: 11px; fill: #71717a }
      .eixo { font-size: 12px; fill: #a1a1aa }
      .val { font-size: 12px; font-weight: 700; fill: #f4f4f5 }
      .tipo { font-size: 11px; fill: #71717a }
      .mini { font-size: 10.5px; fill: #71717a }
      @keyframes cresce { from { transform: scale(.2); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      .area { transform-box: view-box; transform-origin: 257px 415px; animation: cresce 1.4s cubic-bezier(.2,.8,.2,1) both }
      @media (prefers-reduced-motion: reduce) { .area { animation: none } }
    </style>
  </defs>

  <rect width="1000" height="600" rx="18" fill="#000"/>

  <rect width="1000" height="600" rx="18" fill="url(#pGlow2)"/>

  <text x="30" y="52" class="h1">PAINEL DA PROFE</text>
  <text x="30" y="74" class="sub">competências e habilidades que coloco em jogo no desenvolvimento das aulas</text>

  <g>

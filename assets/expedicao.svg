  <defs>
    <radialGradient id="eGlowCyan" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#22C3D9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22C3D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eGlowPink" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#F23D91" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F23D91" stop-opacity="0"/>

    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
  </linearGradient>
  <radialGradient id="luz" cx=".75" cy=".2" r=".6"><stop offset="0" stop-color="#8D48E5" stop-opacity=".22"/><stop offset="1" stop-color="#8D48E5" stop-opacity="0"/></radialGradient>

name: Atualizar mapa, trilha, painel e construtor

on:
  push:
    branches: [main]
    paths:
      - "data/alcance.json"
      - "data/trilha.json"
      - "data/painel.json"
      - "scripts/generate_map.py"
      - "scripts/generate_trilha.py"
      - "scripts/generate_painel.py"
      - "scripts/generate_construtor.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-visuais:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar mapa a partir de data/alcance.json
        run: python scripts/generate_map.py

      - name: Gerar trilha a partir de data/trilha.json
        run: python scripts/generate_trilha.py

      - name: Gerar painel a partir de data/painel.json
        run: python scripts/generate_painel.py

      - name: Gerar construtor
        run: python scripts/generate_construtor.py

      - name: Comitar visuais atualizados (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/mapa-alcance.svg assets/trilha-rpg.svg assets/painel.svg assets/construtor.svg
          git diff --cached --quiet || git commit -m "chore: atualiza mapa, trilha, painel e construtor"
          git pull --rebase origin main
          git push

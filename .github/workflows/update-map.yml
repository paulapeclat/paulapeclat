name: Atualizar mapa de alcance

on:
  push:
    branches: [main]
    paths:
      - "data/alcance.json"
      - "scripts/generate_map.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar mapa a partir de data/alcance.json
        run: python scripts/generate_map.py

      - name: Comitar mapa atualizado (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/mapa-alcance.svg
          git diff --cached --quiet || git commit -m "chore: atualiza mapa de alcance"
          git pull --rebase origin main
          git push

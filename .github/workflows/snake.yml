name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "30 8 * * *"   # todo dia, 08:30 UTC (~05:30 horário de Brasília)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SVG da cobrinha (paleta do site)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?palette=github-dark&color_snake=#22C3D9&color_dots=#161b22,#0f4b56,#14808f,#22C3D9,#F23D91

      - name: Comitar cobrinha atualizada (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          git diff --cached --quiet || git commit -m "chore: atualiza cobrinha das contribuições"
          git push

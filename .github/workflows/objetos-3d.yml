name: Renderizar objetos 3D da trilha

on:
  push:
    branches: [main]
    paths:
      - "data/modelos/**"
      - "scripts/render_objetos.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright com Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Renderizar modelos Smooth Voxels com three.js
        run: python scripts/render_objetos.py

      - name: Regenerar a trilha com os objetos novos
        run: python scripts/generate_trilha.py

      - name: Comitar (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/objetos assets/trilha-rpg.svg
          git diff --cached --quiet || git commit -m "chore: renderiza objetos 3D da trilha"
          git pull --rebase origin main
          git push
